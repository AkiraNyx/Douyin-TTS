name: Build MSIX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'DouyinTTS.sln'
  APP_PROJECT: 'src/DouyinTTS.App/DouyinTTS.App.csproj'
  CERT_PASSWORD: 'DouyinTTS2024'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Decode and import certificate
      shell: pwsh
      run: |
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        $pfxPath = "${{ github.workspace }}\src\DouyinTTS.App\DouyinTTS.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        $pwd = ConvertTo-SecureString -String '${{ env.CERT_PASSWORD }}' -Force -AsPlainText
        Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $pwd
        Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -Password $pwd

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: |
        dotnet build ${{ env.APP_PROJECT }} `
          --configuration Release `
          --no-restore `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxBundle=Never

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTTS-${{ matrix.platform }}
        path: src/DouyinTTS.App/AppPackages/**/*.msix
        if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: artifacts/**/*.msix
