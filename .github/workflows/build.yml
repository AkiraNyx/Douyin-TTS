name: Build MSIX

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'DouyinTTS.sln'
  APP_PROJECT: 'src/DouyinTTS.App/DouyinTTS.App.csproj'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build unsigned MSIX
      run: |
        dotnet build ${{ env.APP_PROJECT }} `
          --configuration Release `
          --no-restore `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxBundle=Never `
          -p:AppxPackageSigningEnabled=false

    - name: Sign MSIX
      shell: pwsh
      run: |
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        $pfxPath = "${{ github.workspace }}\DouyinTTS.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        $msix = Get-ChildItem -Path "src\DouyinTTS.App\AppPackages" -Filter "*.msix" -Recurse | Select-Object -First 1
        $signtool = Get-ChildItem -Path "${{ runner.temp }}\..\..\.nuget\packages\microsoft.windows.sdk.buildtools" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1

        if (-not $signtool) {
          $signtool = Get-ChildItem -Path "C:\Users\runneradmin\.nuget\packages\microsoft.windows.sdk.buildtools" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
        }

        if ($signtool -and $msix) {
          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p "DouyinTTS2024" $msix.FullName
        } else {
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "msix: $($msix.FullName)"
          Write-Host "WARNING: Could not sign"
        }

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTTS-${{ matrix.platform }}
        path: src/DouyinTTS.App/AppPackages/**/*.msix
        if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: artifacts/**/*.msix
