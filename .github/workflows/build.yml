name: Build MSIX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'DouyinTTS.sln'
  APP_PROJECT: 'src/DouyinTTS.App/DouyinTTS.App.csproj'
  CERT_PASSWORD: 'DouyinTTS2024'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Decode certificate
      shell: pwsh
      run: |
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        [IO.File]::WriteAllBytes("${{ github.workspace }}\DouyinTTS.pfx", $pfxBytes)

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: |
        dotnet build ${{ env.APP_PROJECT }} `
          --configuration Release `
          --no-restore `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxBundle=Never `
          -p:AppxPackageSigningEnabled=false

    - name: Sign MSIX
      shell: pwsh
      run: |
        $msix = Get-ChildItem -Path "src\DouyinTTS.App\AppPackages" -Filter "*.msix" -Recurse | Select-Object -First 1
        if ($msix) {
          # Find signtool
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $signtool) {
            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          }
          if ($signtool) {
            & $signtool.FullName sign /f "${{ github.workspace }}\DouyinTTS.pfx" /p "${{ env.CERT_PASSWORD }}" /fd SHA256 $msix.FullName
          } else {
            Write-Host "signtool not found, skipping signing"
          }
        }

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTTS-${{ matrix.platform }}
        path: src/DouyinTTS.App/AppPackages/**/*.msix
        if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: artifacts/**/*.msix
